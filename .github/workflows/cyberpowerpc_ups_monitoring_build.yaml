name: cyberpowerpc_ups_monitoring_container_build

on:
  push:
    branches:
      - "main"
    paths:
      - "pyproject.toml"
      - "platform_utils/**"
      - "IoT/pyproject.toml"
      - "IoT/iot_libraries/*"
      - "IoT/cyberpowerpc_pfc1500_ups/*"
      - ".github/workflows/ups1_cyberpowerpfc1500.yaml"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Read version
        id: version
        run: echo "value=$(cat IoT/cyberpowerpc_pfc1500_ups/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./IoT/cyberpowerpc_pfc1500_ups/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            markhamlee/cyberpowerpfc1500lcd:latest
            markhamlee/cyberpowerpfc1500lcd:${{ steps.version.outputs.value }}