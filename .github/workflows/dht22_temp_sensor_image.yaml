name: IoT_DHT22_Build

on:
  push:
    branches:
      - "main"
    paths:
      - "pyproject.toml"
      - "platform_utils/**"
      - "IoT/pyproject.toml"
      - "IoT/iot_libraries/*"
      - "IoT/dht22_temp_sensor/*"
      - ".github/workflows/dht22_temp_sensor_image.yaml"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
    
      - name: Read version
        id: version
        run: echo "value=$(cat IoT/dht22_tempo_sensor/VERSION)" >> "$GITHUB_OUTPUT"   

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
   
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
   
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
   
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./IoT/dht22_temp_sensor/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            markhamlee/dht22_monitoring:latest
            markhamlee/dht22_monitoring:${{ steps.version.outputs.value }}