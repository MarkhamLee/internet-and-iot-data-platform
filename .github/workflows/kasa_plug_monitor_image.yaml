name: Kasa_Smartplug_Image_Build

on:
  push:
    branches:
      - "main"
    paths:
      - "pyproject.toml"
      - "platform_utils/**"
      - "IoT/pyproject.toml"
      - "IoT/iot_libraries/*"
      - "IoT/kasa_smart_plug/*"
      - ".github/workflows/kasa_plug_monitor_image.yaml"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Read version
        id: version
        run: echo "value=$(cat IoT/kasa_smart_plug/VERSION)" >> "$GITHUB_OUTPUT"      
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./IoT/kasa_smart_plug/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            markhamlee/kasaplugs_influx:latest
            markhamlee/kasaplugs_influx:${{ steps.version.outputs.value }}